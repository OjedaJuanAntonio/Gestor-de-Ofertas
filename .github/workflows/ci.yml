name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    # Postgres para los tests de integración (Vitest) — coincide con docker-compose.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gestor
          POSTGRES_PASSWORD: gestor_dev
          POSTGRES_DB: gestor_ofertas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestor -d gestor_ofertas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gestor:gestor_dev@localhost:5432/gestor_ofertas
      DIRECT_URL: postgresql://gestor:gestor_dev@localhost:5432/gestor_ofertas
      AUTH_SECRET: ci-secret-de-32-caracteres-o-mas-para-el-pipeline
      EMAIL_DRY_RUN: "true"

    defaults:
      run:
        working-directory: next-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      - name: Seed (requerido por los tests de integración)
        run: npx prisma db seed

      - name: Vulnerabilidades en dependencias de producción (altas o críticas)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (unit + integración)
        run: npm test

      - name: Build (next build)
        run: npm run build

  e2e:
    name: e2e (Playwright + axe)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gestor
          POSTGRES_PASSWORD: gestor_dev
          POSTGRES_DB: gestor_ofertas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestor -d gestor_ofertas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gestor:gestor_dev@localhost:5432/gestor_ofertas
      DIRECT_URL: postgresql://gestor:gestor_dev@localhost:5432/gestor_ofertas
      AUTH_SECRET: ci-secret-de-32-caracteres-o-mas-para-el-pipeline
      AUTH_URL: http://localhost:3000
      EMAIL_DRY_RUN: "true"
      # La sesión se revalida contra la base cada 1 s (default: 5 min) para que
      # el e2e pueda comprobar que desactivar un usuario le corta la sesión.
      SESSION_REVALIDAR_SEG: "1"

    defaults:
      run:
        working-directory: next-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      - name: Seed
        run: npx prisma db seed

      # Con reintentos: la instalación baja paquetes del sistema (apt) y un corte
      # de red del runner tiraba abajo el job antes de correr un solo test.
      - name: Instalar navegador de Playwright
        run: |
          for intento in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Falló la instalación del navegador (intento $intento de 3); reintento en 20 s…"
            sleep 20
          done
          exit 1

      - name: E2E (Playwright levanta el dev server)
        run: npm run test:e2e
